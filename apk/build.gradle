// Two plugins, both from the public repositories, and no source dependencies at all: the app is
// a WebView, so there is nothing to vendor. Bump these together - AGP 8.7 and Kotlin 2.0 are a
// matched pair, and a mismatch is a build failure that looks like a code error.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}
