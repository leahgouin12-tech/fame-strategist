# The build box for the Android package, for the days this laptop is not the one doing it.
#
# It is worth being exact about when this runs: only once the repository has a GitHub remote, which
# it does not yet. Until then scripts/build_apk.ps1 is the route, and this file is the reason the
# project can move to CI without anybody re-deriving the toolchain.
#
# Signing is the same mechanism as the local build - the four fame* Gradle properties, written here
# into ~/.gradle/gradle.properties from repository secrets instead of from scripts/make_keystore.ps1.
# No password is put on a command line, and the keystore itself never sits in the repository: it is
# base64 in a secret and a file in the runner's temp folder, which is deleted with the runner.
# Without FAME_KEYSTORE_BASE64 the job still builds, and the artifact is the unsigned APK that
# Android will refuse - the artifact name says so, and apk/README.md explains the next step.

name: apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/**'
      - '.github/workflows/apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key, if the secrets are set
        env:
          FAME_KEYSTORE_BASE64: ${{ secrets.FAME_KEYSTORE_BASE64 }}
          FAME_KEYSTORE_PASSWORD: ${{ secrets.FAME_KEYSTORE_PASSWORD }}
          FAME_KEY_ALIAS: ${{ secrets.FAME_KEY_ALIAS }}
          FAME_KEY_PASSWORD: ${{ secrets.FAME_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${FAME_KEYSTORE_BASE64:-}" ]; then
            echo "No FAME_KEYSTORE_BASE64 secret - the release build will be unsigned."
            exit 0
          fi
          decoded="$RUNNER_TEMP/fame.keystore"
          printf '%s' "$FAME_KEYSTORE_BASE64" | base64 -d > "$decoded"
          {
            echo "fameKeystore=$decoded"
            echo "fameKeystorePassword=$FAME_KEYSTORE_PASSWORD"
            echo "fameKeyAlias=$FAME_KEY_ALIAS"
            echo "fameKeyPassword=$FAME_KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"
          echo "Signed with the key in the secrets."

      - name: Build
        run: gradle -p apk assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fame-strategist-apk
          path: |
            apk/app/build/outputs/apk/release/app-release.apk
            apk/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
