# The Mac this project does not own, borrowed for four minutes.
#
# An .ipa can only be compiled by Apple's toolchain, and that toolchain only runs on macOS. This is
# the $0 way to get one: GitHub Actions' macOS runner builds the wrapper in ios/ and hands back the
# artifact. Nothing here signs anything - signing is AltServer's job on her own Windows PC, with her
# own Apple ID, which is exactly how AltStore Classic works (verified on AltStore's own
# "How to Install (Windows)" page on 2026-11-15: iTunes + iCloud + Apple ID + Wi-Fi sync, no Mac).
#
# So the build is deliberately UNSIGNED. AltStore re-signs a source's .ipa with her personal
# certificate when it installs it, and a personal certificate is precisely what it gets from
# AltServer; a CI runner has no way to hold her Apple ID and should never try.
#
# Two things must be true before this can run, and both are hers: the repository needs a GitHub
# remote (macOS minutes are free on a public repository, billed on a private one), and the first
# green run is also the first time any of this Swift has ever been compiled - the code is written to
# Apple's APIs but it has never met a compiler, and this job is what finds out.

name: ipa

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ipa.yml'

jobs:
  build:
    # macos-14 died under us: GitHub retired every macOS 14 image on 2026-11-02, so a job that asks
    # for it is cancelled in about two seconds with "The configuration 'macos-14-arm64-us-default'
    # is not supported" - no build, no log, nothing to debug. Read off GitHub's own runner-images
    # README on 2026-11-15: the supported arm64 labels are macos-26 and macos-15, and GitHub keeps
    # only the two newest macOS versions live. Pinned to macos-26 rather than macos-latest so the
    # day Apple's next OS moves the -latest label, this file fails loudly instead of silently
    # building on a different Xcode than the one it was written against.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Say which toolchain is doing the work
        run: |
          xcodebuild -version | tee toolchain.txt
          echo "::notice::toolchain: $(head -1 toolchain.txt)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Turn project.yml into a project
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          # A scheme xcodebuild cannot see is one of the ways this job dies with exit 65 and no clue,
          # so name the schemes out loud. The job summary is the reason: unlike the raw log, the
          # summary is readable on a public repository without being signed in to GitHub.
          xcodebuild -list -project FameStrategist.xcodeproj > schemes.txt 2>&1 || true
          cat schemes.txt
          echo "::notice::schemes: $(tr '\n' ' ' < schemes.txt | sed -e 's/%/%25/g' -e 's/"/%22/g' | cut -c1-220)"

      - name: Compile for the device, sign nothing
        working-directory: ios
        run: |
          # errexit has to go before the build, not after it. GitHub hands every run: block to
          # "bash -e", so the previous version of this step died on the line that reported the failure:
          # xcodebuild returned 65, errexit ended the script, and the error lines were never printed -
          # the job was red and, on a public repo where the raw log needs a GitHub login, unreadable.
          # Taking the exit code as a branch instead of a fall-through is what makes the compiler
          # publish its own words as annotations, which the API serves to anyone.
          set +e
          xcodebuild -project FameStrategist.xcodeproj \
            -scheme FameStrategist \
            -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          status=$?
          echo "xcodebuild exited $status"
          say() { printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/#/%23/g' -e 's/"/%22/g' | tr -d '\r' | cut -c1-220; }
          if [ "$status" -ne 0 ]; then
            errs=$(grep -nE "error:|fatal|not currently configured|Multiple commands|The following build commands failed" xcodebuild.log | head -14)
            [ -n "$errs" ] || errs=$(tail -14 xcodebuild.log)
            while IFS= read -r line; do echo "::error::$(say "$line")"; done <<< "$errs"
            {
              echo '### xcodebuild failed (exit '"$status"')'
              echo '```'
              echo "$errs"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # The reporting has to be gated on the exit code. The first version of this block printed
            # the tail of the log either way, so a green build (#6, the one that finally compiled)
            # published eight ::error:: annotations and looked red to anyone reading the summary -
            # a fake failure is as much a lie as a fake success. Warnings now come back as warnings.
            echo "::notice::compiled, unsigned ($(wc -l < xcodebuild.log) lines of build log)"
            grep -E "warning:" xcodebuild.log | sort -u | head -8 \
              | while IFS= read -r line; do echo "::warning::$(say "$line")"; done
          fi
          exit "$status"

      - name: Pack Payload/ into an .ipa
        working-directory: ios
        run: |
          set -euo pipefail
          app="build/DerivedData/Build/Products/Release-iphoneos/FameStrategist.app"
          test -d "$app" || { echo "no built app at $app" >&2; exit 1; }
          rm -rf build/Payload FameStrategist.ipa
          mkdir -p build/Payload
          cp -R "$app" build/Payload/
          (cd build && zip -qry ../FameStrategist.ipa Payload)
          ls -l FameStrategist.ipa
          shasum -a 256 FameStrategist.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: fame-strategist-ipa
          path: ios/FameStrategist.ipa
          if-no-files-found: error
